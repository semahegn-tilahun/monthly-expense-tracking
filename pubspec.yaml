name: monthly_expense_tracker
description: A Flutter Android app for monthly income, expense, savings, credit payment, invisible expense, reminders, multi-user support, and PDF/Excel reports.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  intl: ^0.20.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  pdf: ^3.11.3
  excel: ^4.0.6
  open_filex: ^4.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
